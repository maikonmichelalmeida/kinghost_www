<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Treino Vocal Offline</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header class="control-bar" aria-label="Controles do treino">
  <select id="daySelect" aria-label="Selecionar treino do dia" title="Treino do dia"></select>
  <select id="exerciseSelect" aria-label="Selecionar exercício diretamente" title="Exercício direto"></select>
  <button id="prevBtn" type="button" title="Exercício anterior do treino">← Previous</button>
  <button id="nextBtn" type="button" title="Próximo exercício do treino">Next →</button>
  <audio id="exerciseAudio" controls preload="metadata" aria-label="Áudio de referência do exercício"></audio>
</header>

<main class="exercise-shell">
  <section class="music-data" aria-label="Notas do exercício">
    <div>
      <span>Notas</span>
      <strong id="notesText"></strong>
    </div>
    <div>
      <span>Variação</span>
      <code id="variationText"></code>
    </div>
    <div class="base-training-launch">
      <span>Treino principal</span>
      <div class="training-controls" data-training-key="base">
        <button id="baseStartBtn" class="training-start" type="button">Início</button>
        <button id="baseListenBtn" class="training-listen" type="button" title="Ouvir o guia deste treino">Ouvir</button>
        <label class="transpose-field" title="Transposição atual em semitons (de -8 a +8)">
          <span class="sr-only">Transposição em semitons</span>
          <input id="baseTranspose" type="number" min="-8" max="8" step="1" value="0" inputmode="numeric">
        </label>
        <label class="direction-field" title="Marcado: próximo treino sobe 1 semitom. Desmarcado: desce 1 semitom.">
          <input id="baseDirection" type="checkbox" checked>
          <span>↑</span>
        </label>
        <label class="guided-field" title="Marcado: o instrumento guia toca junto com a voz. Desmarcado: toca apenas a nota inicial.">
          <input id="baseGuided" type="checkbox" checked>
          <span>Guia</span>
        </label>
        <label class="tempo-field" title="Andamento deste treino em batidas por minuto">
          <span class="sr-only">Batidas por minuto</span>
          <button id="baseTempoDown" class="tempo-step" type="button" aria-label="Diminuir 4 bpm">−</button>
          <input id="baseBpm" type="number" min="40" max="180" step="1" value="80" inputmode="numeric">
          <span>bpm</span>
          <button id="baseTempoUp" class="tempo-step" type="button" aria-label="Aumentar 4 bpm">+</button>
        </label>
        <label class="subdivision-field" title="Quantidade de notas por batida">
          <span class="sr-only">Notas por batida</span>
          <select id="baseSubdivision">
            <option value="1">1/pulso</option>
            <option value="2">2/pulso</option>
            <option value="3">3/pulso</option>
            <option value="4">4/pulso</option>
          </select>
        </label>
      </div>
      <label class="instrument-field" title="Som usado pelo guia auditivo">
        <span>Som do guia</span>
        <select id="guideInstrumentSelect">
          <option value="acoustic_guitar_nylon">Violão nylon</option>
          <option value="acoustic_guitar_steel">Violão aço</option>
          <option value="acoustic_grand_piano">Piano acústico</option>
        </select>
      </label>
    </div>
  </section>

  <section class="tab-stage" id="tabStage" aria-label="Tablatura do exercício">
    <button id="fullscreenBtn" class="fullscreen-btn" type="button">Tela cheia</button>
    <img id="tabImage" alt="Tablatura do exercício">
  </section>

  <section class="lesson-frame-wrap">
    <iframe id="lessonFrame" title="Descrição e foco de estudo do exercício"></iframe>
  </section>
</main>

<div id="trainerOverlay" class="trainer-overlay" hidden>
  <div class="trainer-dialog" role="dialog" aria-modal="true" aria-label="Treino assistido de afinação">
    <button id="trainerCloseBtn" class="trainer-close" type="button" aria-label="Fechar treino">×</button>
    <iframe id="trainerFrame" src="trainer/index.html" title="Afinador e avaliador do exercício" allow="microphone; autoplay"></iframe>
  </div>
</div>

<script src="style.js?v=8"></script>
</body>
</html>
